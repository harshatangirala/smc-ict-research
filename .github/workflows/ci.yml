name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The fast profile lowers the bootstrap budget from 10,000 to 5,000.
  # Published numbers come from the default `final` profile; CI checks that the
  # pipeline RUNS and that its invariants hold, not that it reproduces the paper.
  SMC_ICT_PROFILE: fast
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run test suite
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  pipeline:
    name: Trimmed end-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Prepare hermetic sample cache
        # No network: the 50-ticker sample is committed under data/bundle/.
        run: python tools/prepare_sample.py --limit 12

      - name: Run pipeline (skipping the network ingest stage)
        run: python main.py all --skip ingest

      - name: Assert the required artefacts exist and are non-trivial
        run: python tools/check_artifacts.py

      - name: Generate the reviewer report
        run: python tools/reviewer_check.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            results/*.csv
            results/*.md
            results/*.json
          if-no-files-found: error

  lint:
    name: Spec / registry consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Specs must regenerate byte-identically
        run: |
          python tools/generate_specs.py
          git diff --exit-code docs/specs/ || {
            echo "::error::docs/specs/ is stale -- run tools/generate_specs.py and commit";
            exit 1;
          }
      - name: Registry / spec directions must agree
        run: pytest tests/test_pipeline_integrity.py -k "registry or spec" -v

      - name: Detector parameters must be late-bound
        # Guards the sweep: a config value frozen in a default argument makes
        # the whole sensitivity analysis silently return identical results.
        run: pytest tests/test_pipeline_integrity.py -k "LateBound" -v
