# Formal specification -- SMC Fair Value Gap
# Auto-generated by tools/generate_specs.py; edit that file, not this one.
# Schema: docs/specs/_schema.yaml

concept: "SMC Fair Value Gap"
id: smc_fvg
source_script: "SMC_Concepts_LuxAlgo.pine"
source_section: "2.5"
implementation: "signals/smc_signals.py::detect_fvg"

signals:
  - name: smc_fvg_bullish_formed
    direction: +1
  - name: smc_fvg_bearish_formed
    direction: -1

definition: |
  bar_delta_pct_i = (close_{i-1} - open_{i-1}) / open_{i-1}
  threshold_i     = 2 * cumulative_mean(abs(bar_delta_pct))_i   # if auto
  bullish_i = low_i  > high_{i-2} AND close_{i-1} > high_{i-2}
              AND bar_delta_pct_i > threshold_i
  bearish_i = high_i < low_{i-2}  AND close_{i-1} < low_{i-2}
              AND -bar_delta_pct_i > threshold_i

parameters:
  - name: fvg_auto_threshold
    type: bool
    default: True
    allowed_range: "true|false"
    description: "Adaptive vs zero threshold"
  - name: fvg_extend_bars
    type: int
    default: 1
    allowed_range: "0..10"
    description: "Display-only in source; no effect here"

causality: |
  Uses bars i, i-1, i-2 and an expanding mean over bars <= i.

expected_min_occurrences: 500

notes: |
  The implementation divides by `open * 100` where the source uses `/ open *
  100`. Both sides of the comparison carry the same 1e-4 factor, so the test
  is scale-invariant and results are unaffected; left as-is to avoid
  changing published numbers for no benefit.
