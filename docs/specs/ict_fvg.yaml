# Formal specification -- ICT Fair Value Gap
# Auto-generated by tools/generate_specs.py; edit that file, not this one.
# Schema: docs/specs/_schema.yaml

concept: "ICT Fair Value Gap"
id: ict_fvg
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.6"
implementation: "signals/ict_signals.py::detect_fvg"

signals:
  - name: ict_fvg_bullish_formed
    direction: +1
  - name: ict_fvg_bearish_formed
    direction: -1

definition: |
  # FORMATION (tradeable event, fires at bar i)
  bullish_i = displacement_bullish_{i-1} AND low_i  > high_{i-2}
  bearish_i = displacement_bearish_{i-1} AND high_i < low_{i-2}
  
  # GAP REGION (continuous feature)
  bullish gap region = [high_{i-2}, low_i]      # lower, upper
  bearish gap region = [high_i,     low_{i-2}]
  
  # FILL (OUTCOME LABEL -- NOT an entry signal)
  filled_i = exists k in (i, i+N] such that
               bullish: low_k  < high_{i-2}
               bearish: high_k > low_{i-2}

parameters:
  - name: mode
    type: str
    default: FVG
    allowed_range: "FVG|IFVG"
    description: "IFVG is LuxAlgo's non-standard inversion (Ambiguity A1)"
  - name: fill_window_N
    type: int
    default: 60
    allowed_range: "1..250"
    description: "Bars after formation in which a fill counts; default = longest holding period"

causality: |
  Formation uses only bars <= i. The fill column is forward-looking BY
  DESIGN and is emitted with a `_label` suffix, excluded from
  EVENT_REGISTRY. It was previously emitted as a tradeable event.

expected_min_occurrences: 500

notes: |
  Gap-region columns were named `_top`/`_bottom` with inverted meaning;
  renamed `_lower`/`_upper`. See docs/specs/ict_bpr.yaml.
