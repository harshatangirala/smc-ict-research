  - name: smc_internal_choch_bearish
    direction: -1

definition: |
  leg(size):  new_leg_high_i = high_{i-size} > highest(high, size)_i
              new_leg_low_i  = low_{i-size}  < lowest(low, size)_i
  swing high level H set on a bearish-leg transition, price = high_{i-size}
  swing low  level L set on a bullish-leg transition, price = low_{i-size}
  
  crossover_i  = close_i > H AND close_{i-1} <= H
  crossunder_i = close_i < L AND close_{i-1} >= L
  
  bullish break_i = crossover_i AND (not H already crossed)
    -> CHoCH if prior trend bias was BEARISH, else BOS
  bearish break_i = crossunder_i AND (not L already crossed)
    -> CHoCH if prior trend bias was BULLISH, else BOS

