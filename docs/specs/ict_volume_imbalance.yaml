# Formal specification -- ICT Volume Imbalance
# Auto-generated by tools/generate_specs.py; edit that file, not this one.
# Schema: docs/specs/_schema.yaml

concept: "ICT Volume Imbalance"
id: ict_volume_imbalance
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.5"
implementation: "signals/ict_signals.py::detect_volume_imbalance"

signals:
  - name: ict_volume_imbalance_bullish
    direction: +1
  - name: ict_volume_imbalance_bearish
    direction: -1

definition: |
  mx_i = max(close_i, open_i);  mn_i = min(close_i, open_i)
  
  bullish_i = open_i  > close_{i-1}      # gap up on the open
              AND high_{i-1} > low_i     # wicks still overlap
              AND close_i > close_{i-1}
              AND open_i  > open_{i-1}
              AND high_{i-1} < mn_i      # prior high below this body
  
  bearish_i = open_i  < close_{i-1}
              AND low_{i-1} < high_i
              AND close_i < close_{i-1}
              AND open_i  < open_{i-1}
              AND low_{i-1} > mx_i

parameters:
  []

causality: |
  Uses bars i and i-1 only.

expected_min_occurrences: 1000

notes: |
  A volume imbalance is the body-level gap that remains when two candles'
  wicks overlap but their bodies do not -- distinct from a Fair Value Gap,
  which requires a true 3-bar wick-to-wick void.
