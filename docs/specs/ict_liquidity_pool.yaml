# Formal specification -- ICT Liquidity Pool (clustered equal highs/lows)
# Auto-generated by tools/generate_specs.py; edit that file, not this one.
# Schema: docs/specs/_schema.yaml

concept: "ICT Liquidity Pool (clustered equal highs/lows)"
id: ict_liquidity_pool
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.8"
implementation: "signals/ict_signals.py::detect_liquidity"

signals:
  - name: ict_liquidity_buyside_pool_formed
    direction: +1
  - name: ict_liquidity_sellside_pool_formed
    direction: -1
  - name: ict_liquidity_buyside_swept
    direction: +1
  - name: ict_liquidity_sellside_swept
    direction: -1

definition: |
  a    = 10 / margin
  band = ATR(liquidity_atr_len)_i / a
  
  # POOL FORMATION, on a confirmed pivot at bar i with price p
  cluster = { q : q is a same-direction vertex in the last 50
                  AND |q - p| < band }
  pool forms iff |cluster| > liquidity_min_cluster
    mid    = (min(cluster) + max(cluster)) / 2
    region = [mid - band, mid + band]
  
  # SWEEP (legacy semantics, retained for comparison -- see notes)
  buyside_swept_i  = close_i > region.bottom, first time only
  sellside_swept_i = close_i < region.top,    first time only

parameters:
  - name: mss_pivot_len
    type: int
    default: 5
    allowed_range: "3..10"
    description: "Pivot lookback feeding the vertex list"
  - name: liquidity_margin
    type: float
    default: 4.0
    allowed_range: "1.0..20.0"
    description: "Band width divisor; a = 10/margin"
  - name: liquidity_atr_len
    type: int
    default: 10
    allowed_range: "5..50"
    description: "ATR length for the band"
  - name: liquidity_min_cluster
    type: int
    default: 2
    allowed_range: "1..10"
    description: "Pivots required in-band, exclusive (> not >=)"

causality: |
  Pivots carry their confirmation lag; ATR and the vertex list are trailing.

expected_min_occurrences: 500

notes: |
  The `*_swept` signals fire when price merely ENTERS the pool region, with
  no rejection leg -- that is a breakout, not a sweep, which is why they
  behave almost identically to pool formation. They are retained under their
  original names so the reformulation is visible as a comparison; the
  prospective replacement is docs/specs/ict_liquidity_sweep.yaml. Also note
  the cluster test contains a redundant conjunct in the source translation
  (`|q-p| < band` AND `p-band < q < p+band` are the same condition).
