concept: "ICT Liquidity Sweep (stop run + rejection)"
id: ict_liquidity_sweep
source_script: "ICT_Concepts_LuxAlgo.pine + standard ICT definition"
source_section: "1.8"
implementation: "signals/ict_signals.py::detect_liquidity_sweep"

signals:
  - name: ict_sweep_buyside_bearish
    direction: -1
  - name: ict_sweep_sellside_bullish
    direction: +1

definition: |
  L = most recent confirmed swing high (buy-side) / low (sell-side)
  
  # (X) PENETRATION at bar j -- the stop run
  buyside:  high_j > L + X * ATR_j
  sellside: low_j  < L - X * ATR_j
  
  # (Y,Z) RECLAIM at bar k, j < k <= j + Z -- the rejection
  buyside:  close_k < L - Y * ATR_k   -> ict_sweep_buyside_bearish_k
  sellside: close_k > L + Y * ATR_k   -> ict_sweep_sellside_bullish_k
  
  Event is stamped on bar k. If no reclaim occurs within Z bars the
  penetration is discarded.

parameters:
  - name: sweep_penetration_atr
    type: float
    default: 0.25
    allowed_range: "0.05..1.00"
    description: "Minimum penetration beyond the level, in ATR"
  - name: sweep_reclaim_frac
    type: float
    default: 0.0
    allowed_range: "0.0..1.0"
    description: "Reclaim depth past the level, in ATR"
  - name: sweep_confirm_bars
    type: int
    default: 3
    allowed_range: "1..10"
    description: "Bars allowed between penetration and reclaim"
  - name: sweep_atr_len
    type: int
    default: 14
    allowed_range: "5..50"
    description: "ATR length"
  - name: sweep_swing_len
    type: int
    default: 10
    allowed_range: "3..50"
    description: "Swing lookback for the reference level"

causality: |
  Event fires on the reclaim bar k using only bars <= k.

expected_min_occurrences: 100

notes: |
  REPLACES the prior `*_swept` logic, which fired when `close > pool_bottom`
  -- price merely ENTERING the pool, with no rejection leg. That is a
  breakout, not a sweep, and made the 'swept' signals near-duplicates of
  pool formation. The old columns are retained under their original names
  for continuity.
