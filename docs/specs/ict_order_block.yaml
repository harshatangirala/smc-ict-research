# Formal specification -- ICT Order Block
# Auto-generated by tools/generate_specs.py; edit that file, not this one.
# Schema: docs/specs/_schema.yaml

concept: "ICT Order Block"
id: ict_order_block
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.3"
implementation: "signals/ict_signals.py::detect_order_blocks"

signals:
  - name: ict_ob_bullish_formed
    direction: +1
  - name: ict_ob_bearish_formed
    direction: -1
  - name: ict_ob_bullish_mitigated
    direction: -1
  - name: ict_ob_bearish_mitigated
    direction: +1

definition: |
  # Reference swing: the MOST RECENT confirmed swing only (Pine `swings()`
  # replaces its single `var swing` object; older unbroken swings are
  # forgotten, not queued).
  top_level = most recent confirmed swing high, at bar top_bar
  btm_level = most recent confirmed swing low,  at bar btm_bar
  
  # FORMATION at the breaking bar i
  bullish_formed_i = (not top_crossed) AND close_i > top_level
    -> block candle j = argmin over [top_bar .. i] of min_src
    -> block region   = [min_src_j, max_src_j]
  bearish_formed_i = (not btm_crossed) AND close_i < btm_level
    -> block candle j = argmax over [btm_bar .. i] of max_src
  
  # MITIGATION (a formed block being violated)
  bullish_mitigated_i = min(close_i, open_i) < block_bottom
  bearish_mitigated_i = max(close_i, open_i) > block_top

parameters:
  - name: length
    type: int
    default: 10
    allowed_range: ">=3"
    description: "Swing lookback (Pine `length`)"
  - name: use_body
    type: bool
    default: True
    allowed_range: "true|false"
    description: "Use candle bodies vs wicks for the block region"
  - name: ob_max_retained
    type: int
    default: 200
    allowed_range: "10..1000"
    description: "Active-block cap; source is uncapped"

causality: |
  Swing points come from extract_swing_points, which stamps the confirmation
  bar and reads price from `size` bars earlier. Formation fires on the break
  bar. All inputs <= i.

expected_min_occurrences: 200

notes: |
  Mitigation is scored as the OPPOSITE direction to formation: a bullish
  order block failing is bearish evidence. The prior name-substring
  direction heuristic assigned +1 to `ict_ob_bullish_mitigated` because the
  name contains 'bullish'.
