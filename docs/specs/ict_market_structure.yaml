# Formal specification -- ICT Market Structure Shift and Break of Structure
# Auto-generated by tools/generate_specs.py; edit that file, not this one.
# Schema: docs/specs/_schema.yaml

concept: "ICT Market Structure Shift and Break of Structure"
id: ict_market_structure
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.1 + 1.2"
implementation: "signals/ict_signals.py::detect_mss_bos"

signals:
  - name: ict_mss_bullish
    direction: +1
  - name: ict_mss_bearish
    direction: -1
  - name: ict_bos_bullish
    direction: +1
  - name: ict_bos_bearish
    direction: -1

definition: |
  # Zigzag vertices from CONFIRMED pivots (ta.pivothigh/low, right = 1),
  # so a vertex is only usable one bar after the pivot bar itself.
  on confirmed pivot high at bar i:  push/extend an up-vertex at high[i-1]
  on confirmed pivot low  at bar i:  push/extend a down-vertex at low[i-1]
  
  swing_high = price of the most recent up-vertex
  swing_low  = price of the most recent down-vertex
  
  # MSS -- the first break that REVERSES the prevailing direction
  mss_bullish_i = close_i > swing_high AND dir < +1   -> dir := +1
  mss_bearish_i = close_i < swing_low  AND dir > -1   -> dir := -1
  
  # BOS -- a subsequent break CONTINUING the established direction, against
  # a level not already consumed by an MSS or an earlier BOS
  bos_bullish_i = dir == +1 AND close_i > swing_high
                  AND swing_high not in {last_bos_level, last_mss_level}
  bos_bearish_i = mirror

parameters:
  - name: mss_pivot_len
    type: int
    default: 5
    allowed_range: "3..10"
    description: "Pivot left-lookback (Pine `len`); right lookback is 1"

causality: |
  Vertices come from pivots confirmed with right = 1 and priced at bar i-1,
  so bar i uses only bars <= i. The dir/level state machine is sequential
  and reads no future bar.

expected_min_occurrences: 500

notes: |
  MSS and BOS are distinguished only by the state machine: the same
  geometric break is an MSS if it reverses `dir` and a BOS if it continues
  it. The de-duplication against `last_bos_level` and `last_mss_level`
  prevents one swing level from emitting repeatedly as price oscillates
  across it.
