concept: "ICT New Week / New Day Opening Gap"
id: ict_opening_gap
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.9"
implementation: "signals/ict_signals.py::detect_nwog_ndog"

signals:
  - name: ict_nwog_gap_up
    direction: +1
  - name: ict_nwog_gap_down
    direction: -1
  - name: ict_ndog_gap_up
    direction: +1
  - name: ict_ndog_gap_down
    direction: -1

definition: |
  gap_i      = open_i - close_{i-1}
  material_i = abs(gap_i) >= gap_min_atr * ATR(gap_atr_len)_{i-1}
  week_open_i = dayofweek_i <= dayofweek_{i-1}      # calendar week rolled over
  
  nwog_up_i   = enabled_nwog AND material_i AND week_open_i AND gap_i > 0
  nwog_down_i = enabled_nwog AND material_i AND week_open_i AND gap_i < 0
  ndog_up_i   = enabled_ndog AND material_i AND gap_i > 0
  ndog_down_i = enabled_ndog AND material_i AND gap_i < 0

parameters:
  - name: gap_min_atr
    type: float
    default: 0.1
    allowed_range: "0.0..2.0"
    description: "Minimum |gap| as a multiple of ATR"
  - name: gap_atr_len
    type: int
    default: 14
    allowed_range: "5..50"
    description: "ATR length"
  - name: nwog_enabled
    type: bool
    default: True
    allowed_range: "true|false"
    description: "Source default: on"
  - name: ndog_enabled
    type: bool
    default: False
    allowed_range: "true|false"
    description: "Source default: off"

causality: |
  Uses close_{i-1}, open_i and ATR through bar i-1 only.

expected_min_occurrences: 100

notes: |
  DEFECT FIXED: `ict_ndog_formed` was `True` on essentially every bar --
  1,946,675 events, 45% of the entire event table -- because it tested only
  that open and prior close were non-null. It also ignored the enable flags,
  and carried an unsigned gap size, so the melted event had direction 0 and
  was coerced long.
