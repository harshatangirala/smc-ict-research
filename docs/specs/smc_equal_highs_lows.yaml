  - name: equal_hl_atr_len
    type: int
    default: 200
    allowed_range: "20..400"
    description: "ATR length"

causality: |
  Swing points carry their confirmation lag; ATR is trailing.

expected_min_occurrences: 100

notes: |
  DIRECTION ASSIGNED EXPLICITLY. Equal highs are resistance with resting
