concept: "ICT Displacement Candle"
id: ict_displacement
source_script: "ICT_Concepts_LuxAlgo.pine"
source_section: "1.4"
implementation: "signals/ict_signals.py::detect_displacement"

signals:
  - name: ict_displacement_bullish
    direction: +1
  - name: ict_displacement_bearish
    direction: -1

definition: |
  body_i        = abs(close_i - open_i)
  mean_body_i   = SMA(body, length)_i
  mx_i          = max(close_i, open_i);  mn_i = min(close_i, open_i)
  clean_body_i  = (high_i - mx_i < body_i * perc_body)
                  AND (mn_i - low_i < body_i * perc_body)
  bullish_i     = body_i > mean_body_i AND clean_body_i AND close_i > open_i
  bearish_i     = body_i > mean_body_i AND clean_body_i AND close_i < open_i

parameters:
  - name: length
    type: int
    default: 5
    allowed_range: "3..10"
    description: "Body-average lookback (Pine `len`)"
  - name: perc_body
    type: float
    default: 0.36
    allowed_range: "0.05..0.90"
    description: "Max wick fraction of body; hard-coded `perc_Body` in source"

causality: |
  Uses only bars <= i. SMA window is trailing and includes bar i.

expected_min_occurrences: 200

notes: |
  Directional by construction; no confirmation lag.
