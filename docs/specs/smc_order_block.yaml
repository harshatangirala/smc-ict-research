concept: "SMC Order Block"
id: smc_order_block
source_script: "SMC_Concepts_LuxAlgo.pine"
source_section: "2.3"
implementation: "signals/smc_signals.py::_structure_and_ob"

signals:
  - name: smc_swing_ob_bullish_formed
    direction: +1
  - name: smc_swing_ob_bearish_formed
    direction: -1
  - name: smc_swing_ob_bullish_mitigated
    direction: -1
  - name: smc_swing_ob_bearish_mitigated
    direction: +1
  - name: smc_internal_ob_bullish_formed
    direction: +1
  - name: smc_internal_ob_bearish_formed
    direction: -1
  - name: smc_internal_ob_bullish_mitigated
    direction: -1
  - name: smc_internal_ob_bearish_mitigated
    direction: +1

definition: |
  # Volatility-adjusted source (guards against one outlier bar)
  high_vol_bar_i = (high_i - low_i) >= 2 * ATR(ob_atr_len)_i
  parsed_high_i  = low_i  if high_vol_bar_i else high_i
  parsed_low_i   = high_i if high_vol_bar_i else low_i
  
  # FORMATION on a structure break at bar i (see smc_structure)
  # Pine storeOrdeBlock; the range EXCLUDES the break bar itself
  bullish: j = argmin parsed_low  over [pivot_bar, i)
  bearish: j = argmax parsed_high over [pivot_bar, i)
  block region = [parsed_low_j, parsed_high_j]
  
  # MITIGATION (High/Low mode, the source default)
  bullish_mitigated_i = low_i  < block_bottom
  bearish_mitigated_i = high_i > block_top

parameters:
  - name: ob_atr_len
    type: int
    default: 200
    allowed_range: "20..400"
    description: "Volatility measure length"
  - name: ob_filter_mode
    type: str
    default: Atr
    allowed_range: "Atr|Cumulative Mean Range"
  - name: ob_mitigation_mode
    type: str
    default: High/Low
    allowed_range: "Close|High/Low"
  - name: ob_max_retained
    type: int
    default: 100
    allowed_range: "10..500"
    description: "Matches the source array cap"

causality: |
  All inputs <= i.

expected_min_occurrences: 200

notes: |
  Mitigation direction is inverted relative to formation, as for ICT. A
  mitigated block is removed from the live set, so the 100-block cap counts
  live blocks only, as in the Pine source. DEFECT FIXED: the first
